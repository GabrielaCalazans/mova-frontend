<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#f7fbff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#071c30" media="(prefers-color-scheme: dark)" />
    <meta name="description" content="MOVA — locação de veículos por demanda, com retirada em garagens e frota adaptada para PCD." />
    <link rel="icon" type="image/png" sizes="32x32" href="/brand/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/brand/favicon-192.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/brand/favicon-180.png" />
    <title>MOVA</title>
    <script>
      // Aplica o tema salvo antes da primeira pintura (mesma chave do ThemeContext).
      (function () {
        try {
          var t = localStorage.getItem('mova:tema-escuro:v2');
          if (t === 'true') document.documentElement.setAttribute('data-theme', 'dark');
          if (t === 'false') document.documentElement.setAttribute('data-theme', 'light');
        } catch (e) {
          /* storage bloqueado: segue o sistema */
        }
      })();
    </script>
    <style>
      /* Splash até o React montar. Cores literais porque tokens.css ainda não carregou. */
      html { background: #f7fbff; }
      html[data-theme="dark"] { background: #071c30; }
      @media (prefers-color-scheme: dark) { html:not([data-theme="light"]) { background: #071c30; } }
      .boot-splash { min-height: 100dvh; display: grid; place-items: center; }
      .boot-splash img { width: min(240px, 60vw); height: auto; }
      .boot-splash .boot-dark { display: none; }
      html[data-theme="dark"] .boot-light { display: none; }
      html[data-theme="dark"] .boot-dark { display: block; }
      @media (prefers-color-scheme: dark) {
        html:not([data-theme="light"]) .boot-light { display: none; }
        html:not([data-theme="light"]) .boot-dark { display: block; }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="boot-splash" role="status" aria-label="Carregando MOVA">
        <img class="boot-light" src="/brand/light/logo-loading.png" width="640" height="480" alt="MOVA — Mobilidade para todos" />
        <img class="boot-dark" src="/brand/dark/logo-loading.png" width="640" height="480" alt="MOVA — Mobilidade para todos" />
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
